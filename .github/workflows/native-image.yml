name: Native Image Smoke

on:
  push:
    branches: [master]
  workflow_dispatch:

# 与 ci.yml 同一套加固口径：最小权限、超时、并发取消、action SHA pin
permissions:
  contents: read

concurrency:
  group: native-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          # native-image 随发行版提供，不设 components 就不会调用 gu；JDK 17 那份 GraalVM
          # 的 gu 已无法解析 Oracle 目录里的新版本号格式（2026-10 起必失败，见 setup-graalvm 告警）
          # 该 action 用 token 避免下载 GraalVM 时触发匿名限流，刻意保留
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Native smoke test (build + launch + assert)
        run: bash ./scripts/native-smoke-test.sh
