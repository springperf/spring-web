name: Spring Boot E2E Matrix

# 跨版本 E2E 不进 PR 门禁：每个版本都要真实启动 Netty 服务器，3~4 个版本 × 全量 E2E 会拖长反馈。
# 每周一次 + 手动触发，补齐 ci.yml 的 spring-boot-versions job（只跑单测）覆盖不到的运行期路径。
on:
  schedule:
    # 每周日 04:00 UTC（北京时间 12:00），与 push/PR CI 及 mutation.yml 的周五错峰
    - cron: '0 4 * * 0'
  workflow_dispatch:

# 与 ci.yml / mutation.yml 同一套加固口径：最小权限、超时、并发取消、action SHA pin
permissions:
  contents: read

concurrency:
  group: boot-e2e-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-e2e:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.5 由默认 build job 覆盖单测，这里补齐它的 E2E 基线，使「3.2 ~ 3.5」自洽
        boot: ['3.2', '3.3', '3.4', '3.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Minimal E2E on Spring Boot ${{ matrix.boot }}
        # -am 保证上游模块用同一 Boot 版本重新编译；-Dtest 只挑真实启动服务器的最小冒烟集。
        # failIfNoSpecifiedTests=false：上游模块没有这些测试类，不应因此失败。
        run: >
          ./mvnw -Pspring-boot-${{ matrix.boot }} -pl spring-web-test -am test
          -Dtest=AdditionalEndpointsE2ETest,ManagementPortConflictTest,WebServerInitializedEventOrderTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Djacoco.skip=true -Dspotbugs.skip=true -Dmodernizer.skip=true
          --batch-mode --no-transfer-progress

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports-boot${{ matrix.boot }}-e2e
          path: "**/target/surefire-reports/*.txt"
          if-no-files-found: ignore
