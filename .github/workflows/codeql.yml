name: CodeQL

on:
  push:
    branches: [master, 2.7.x]
  pull_request:
    branches: [master, 2.7.x]
  schedule:
    # Weekly (Monday 03:00 UTC): catches issues in dependencies that only change over time.
    - cron: '0 3 * * 1'

# Least privilege. This workflow lives in its own file on purpose: CodeQL needs
# security-events: write, and granting that inside ci.yml would raise the token
# scope of every other job there.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}

      # Explicit build instead of autobuild: a multi-module Maven reactor with a
      # pinned JDK is more reliable, and it keeps the jmh benchmark profiles inactive.
      - name: Build (skip tests)
        run: ./mvnw clean package -DskipTests --batch-mode --no-transfer-progress

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:${{ matrix.language }}"
