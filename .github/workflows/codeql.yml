name: CodeQL

on:
  push:
    branches: [master, 2.7.x]
  pull_request:
    branches: [master, 2.7.x]
  schedule:
    # Weekly (Monday 03:00 UTC): catches issues in dependencies that only change over time.
    - cron: '0 3 * * 1'

# Least privilege. This workflow lives in its own file on purpose: CodeQL needs
# security-events: write, and granting that inside ci.yml would raise the token
# scope of every other job there.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}

      # Explicit build instead of autobuild: a multi-module Maven reactor with a
      # pinned JDK is more reliable, and it keeps the jmh benchmark profiles inactive.
      - name: Build (skip tests)
        run: ./mvnw clean package -DskipTests --batch-mode --no-transfer-progress

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"
