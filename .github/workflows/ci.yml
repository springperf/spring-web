name: CI

on:
  push:
    branches: [master, 2.7.x, 4.1.x]
  pull_request:
    branches: [master, 2.7.x, 4.1.x]

# 供应链加固（提炼自 mybatis-parent 工程实践清单）：最小权限 + 同分支新推送取消旧 run
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 各分支的 JDK 组合：2.7.x=8/11/17，master=17/21/25，4.1.x=17/21/25
    # （4.1.x 在此只跑默认 profile；4.x 路径由 boot4-compat job 单独覆盖）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 一个 JDK 组合失败不影响观察其他组合
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        # 用仓库自带 Wrapper（与所有人同一 Maven 版本）；setup-java@v4 已弃用，故 pin v5
        run: ./mvnw clean test --batch-mode --no-transfer-progress -q
        if: |
          (github.event_name == 'pull_request' || github.event_name == 'push')
          && (
            contains(fromJSON('["8", "11", "17"]'), matrix.java)
            && (github.ref == 'refs/heads/2.7.x' || github.base_ref == '2.7.x')
            ||
            contains(fromJSON('["17", "21", "25"]'), matrix.java)
            && (github.ref == 'refs/heads/master' || github.base_ref == 'master')
            ||
            contains(fromJSON('["17", "21", "25"]'), matrix.java)
            && (github.ref == 'refs/heads/4.1.x' || github.base_ref == '4.1.x')
          )

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports-java${{ matrix.java }}
          path: "**/target/surefire-reports/*.txt"

  docs:
    # Markdown 一致性检查（坏链 / 锚点 / 编码与格式 / 符号），与 JDK 无关，独立成 job 只跑一次。
    # 覆盖 master 与 4.1.x：两者的文档基线都已校验为 0 defect，纳入门禁不会误红。
    # 仍不含 2.7.x —— 该分支文档基线未做校验，贸然纳入会红。
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || github.ref == 'refs/heads/4.1.x' || github.base_ref == '4.1.x'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check docs (links / anchors / format / symbols)
        run: bash scripts/check-docs.sh

  boot4-compat:
    # 4.1.x 专属门禁：用 -Pspring-boot-4.1 跑全 reactor 的 test-compile，
    # 覆盖「一份代码同时支持 3.5.x 与 4.x」中的 4.x 那半条路径。
    # 背景：该分支长期只被当成本地工作分支，CI 从未在其上跑过任何 profile，
    # 于是 4.x 适配的编译问题只能靠人工发现。本 job 补上这个缺口。
    # 只做 test-compile：4.x 下的部分 E2E 依赖 Boot 4 的模块拆分（starter-json 不再
    # 传递 spring-web 等），跑全量测试需要额外适配，当前以「能编译」为门禁下限。
    if: github.ref == 'refs/heads/4.1.x' || github.base_ref == '4.1.x'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Compile against Spring Boot 4.1
        # 先 clean：跨 profile 切换必须清 target，否则残留的 3.5 字节码会让编译
        # 假绿/假红（4.1.x 适配期实测踩过 NoSuchMethodError 的坑）。
        run: ./mvnw clean test-compile -Pspring-boot-4.1 --batch-mode --no-transfer-progress -q

  static-analysis:
    # SpotBugs + modernizer（提炼自 mybatis-parent）：独立成 job，避免给 8/11 旧 JDK 矩阵添负担
    # （SpotBugs 自身要求较新的 JDK 运行）。现阶段 report-only，triage 后翻开关成为硬门禁。
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # 走 verify 绑定的门禁：SpotBugs check（Default 档：高+中优先级）+ modernizer（report-only，331 条待 triage）+ JaCoCo 报告，
      # 与本地 mvn verify 完全一致（此前 CLI 直调 goal 与 pom 绑定各管一半，容易误判门禁状态）
      - name: SpotBugs gate + modernizer
        run: ./mvnw verify -DskipTests --batch-mode --no-transfer-progress -q

      # 跑真正的 format 目标再断言工作区零改动：formatter:validate 只看格式化，看不见 profile 还会做的
      # 「删除未用 import」这类改写 —— 实测它报绿而一次模块级 format 改写了 44 个文件。
      # 修法见 CONTRIBUTING 的 Formatting 一节。
      - name: Check formatting (format then assert no diff)
        run: |
          set -euo pipefail
          ./mvnw -Dformat=true process-sources --batch-mode --no-transfer-progress -q
          if ! git diff --exit-code; then
            echo "::error::Formatting differs from the format profile; run ./mvnw -Dformat=true process-sources and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Upload SpotBugs XML
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: spotbugs-xml
          path: "**/spotbugsXml.xml"
          if-no-files-found: ignore

  binary-compat:
    # japicmp 二进制兼容门禁：拿「同一 minor 系列的上一个 release tag」构建的产物当基线，与当前分支对比。
    # 为什么用 -Pcompat-file（jar 路径）而不是 -Pcompat（按版本号从仓库解析）：后者在本地 install 过
    # 同版本自构建 jar 时会静默变成「自比对」，得出 No incompatible changes 的假结论（pom 注释已记录该踩坑）。
    # 为什么限定同一 minor：跨 minor/major 的比较混有大量按语义版本本就允许的破坏，噪声盖过信号。
    # 该系列还没有 release tag 时跳过（首个 3.5.x tag 之后自动开始生效），避免用一个必然红的基线污染门禁。
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Resolve baseline tag
        id: baseline
        run: |
          set -euo pipefail
          CURRENT=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version -pl spring-web --batch-mode)
          MINOR=$(printf '%s' "$CURRENT" | cut -d. -f1,2)
          TAG=$(git tag --list "v${MINOR}.*" --sort=-v:refname | head -1)
          echo "current=${CURRENT} minor=${MINOR} baseline_tag=${TAG:-<none>}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build baseline jar from tag
        if: steps.baseline.outputs.tag != ''
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.baseline.outputs.tag }}"
          # 该基线 tag 早于 wrapper 引入（3.5.6 发布时仓库还没有 mvnw），直接 ./mvnw 会 127。
          # 从触发本次 run 的提交取回 wrapper：不动 tag 内容，只让它可用，并带上修正后的校验和。
          git checkout "$GITHUB_SHA" -- mvnw mvnw.cmd .mvn
          ./mvnw -pl spring-web -am package -DskipTests -Dmaven.source.skip=true -Dmaven.javadoc.skip=true --batch-mode --no-transfer-progress -q
          mkdir -p "$RUNNER_TEMP/baseline"
          cp "$(ls spring-web/target/spring-web-*.jar | grep -v -e sources -e javadoc -e tests | head -1)" "$RUNNER_TEMP/baseline/spring-web.jar"
          # 回到触发本次 run 的那个提交。不能写 `git checkout -`：PR 上 checkout 出来的是 detached HEAD，
          # 该写法会回到「上一个分支」，于是后面比对的不是本 PR 的产物 —— 静默通过，正是本 job 要避免的假结论。
          git checkout --detach "$GITHUB_SHA"

      - name: Compare against baseline
        if: steps.baseline.outputs.tag != ''
        run: ./mvnw -pl spring-web -am -Pcompat-file -Dcompat.oldJar="$RUNNER_TEMP/baseline/spring-web.jar" verify -DskipTests --batch-mode --no-transfer-progress

      - name: Skip notice
        if: steps.baseline.outputs.tag == ''
        run: echo "::notice::当前 minor 系列尚无 release tag，跳过二进制兼容对比；打出该系列第一个 tag 后本 job 自动启用。"

      - name: Upload japicmp report
        if: always() && steps.baseline.outputs.tag != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: japicmp-report
          path: "**/target/japicmp/*"
          if-no-files-found: ignore

  javadoc:
    # Javadoc 也是一次“文档正确性编译”：坏链接 / 坏标签在此暴露。
    # doclint 排除 missing：不强求全量注释，只拦坏链接与坏标签。
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Install the reactor for the javadoc run
        # javadoc:javadoc 是“直接调 goal”：它只能从本地仓库解析各模块产物，而独立 runner
        # 上什么都没构建过，于是 spring-web:jar 找不到（CI 实测：spring-web-websocket 解析失败）。
        # 先 install 一次（跳过 spotbugs/modernizer/javadoc 这些重活），下面那条命令才有东西可用。
        run: ./mvnw install -DskipTests -Dspotbugs.skip=true -Dmodernizer.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true --batch-mode --no-transfer-progress -q

      - name: "Javadoc (doclint: all except missing)"
        run: ./mvnw javadoc:javadoc -DadditionalJOption=-Xdoclint:all,-missing --batch-mode --no-transfer-progress -q
