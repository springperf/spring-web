name: CI

on:
  push:
    branches: [master, 2.7.x]
  pull_request:
    branches: [master, 2.7.x]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 一个 JDK 组合失败不影响观察其他组合
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test (push to any branch, or any PR)
        # 用仓库自带 Wrapper（与所有人同一 Maven 版本）
        run: ./mvnw clean test --batch-mode --no-transfer-progress -q
        if: |
          (github.event_name == 'pull_request' || github.event_name == 'push')
          && (
            contains(fromJSON('["8", "11", "17"]'), matrix.java)
            && (github.ref == 'refs/heads/2.7.x' || github.base_ref == '2.7.x')
            ||
            contains(fromJSON('["17", "21"]'), matrix.java)
            && !(github.ref == 'refs/heads/2.7.x' || github.base_ref == '2.7.x')
          )

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports-java${{ matrix.java }}
          path: "**/target/surefire-reports/*.txt"

      - name: Coverage gate
        # 聚合 CSV 由 coverage-aggregate 模块在 test 阶段产出（report-aggregate，含 E2E 触发的覆盖）。
        # 只在一个 JDK 组合上判定，避免同一份数据重复失败、也避免给 8/11 旧 JDK 矩阵添负担。
        if: matrix.java == 17
        run: python3 scripts/check-coverage.py

      - name: Generate SBOM
        # 只做交付物追溯（不发 Central，因此不涉及合规硬要求）；放 JDK 17 上只跑一次。
        if: matrix.java == 17
        run: ./mvnw cyclonedx:makeAggregateBom --batch-mode --no-transfer-progress

      - name: Upload SBOM
        if: always() && matrix.java == 17
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom-json
          path: target/bom.json
          if-no-files-found: ignore

      - name: Upload coverage CSV
        if: always() && matrix.java == 17
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-csv-java${{ matrix.java }}
          path: coverage-aggregate/target/site/jacoco-aggregate/jacoco.csv
          if-no-files-found: ignore

      - name: Report flaky tests
        # 重跑后通过的用例不算失败（E2E 模块配了 rerunFailingTestsCount=1），但必须显式可见，
        # 否则「重试掩盖真 bug」会变成静默行为。
        if: always()
        run: |
          set -euo pipefail
          files=$(grep -rl 'Flaky: [1-9]' --include='*.txt' . || true)
          if [ -n "$files" ]; then
            count=$(printf '%s\n' "$files" | wc -l)
            echo "::warning::${count} 个测试报告含重跑后才通过的 flaky 用例"
            while IFS= read -r f; do grep -h 'Flaky: [1-9]' "$f" || true; done <<< "$files"
          else
            echo "no flaky tests detected"
          fi

  spring-boot-versions:
    # 本分支支持范围为 Spring Boot 2.7.x（见 docs/compatibility.md「支持范围」），
    # 故矩阵只保留 2.7：验证 -Pspring-boot-2.7 显式锁定仍可构建，且与默认激活结果一致。
    if: github.ref == 'refs/heads/2.7.x' || github.base_ref == '2.7.x'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        boot: ['2.7']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Test spring-web on Spring Boot ${{ matrix.boot }}
        # 只跑核心模块：全 reactor 太拖长 PR 反馈；nightly 若需要可扩到 -am 全量。
        run: >
          ./mvnw -Pspring-boot-${{ matrix.boot }} -pl spring-web -am test
          -Djacoco.skip=true -Dspotbugs.skip=true -Dmodernizer.skip=true
          --batch-mode --no-transfer-progress

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports-boot${{ matrix.boot }}
          path: "**/target/surefire-reports/*.txt"
          if-no-files-found: ignore

  netty-leaks:
    # ByteBuf 引用计数只在 paranoid 级别报告泄漏；默认 simple 采样会漏掉低频路径。
    # 独立 job：paranoid 有明显开销，不塞进 5 个 JDK 的 build 矩阵。
    # 与 master 的差异：master 把该 job 限定在 master 分支，2.7.x 分支需自己放行，
    # 故 if 同时覆盖 push 的 github.ref 与 PR 的 github.base_ref（同 spring-boot-versions job）。
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || github.ref == 'refs/heads/2.7.x' || github.base_ref == '2.7.x'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: ByteBuf leak check (paranoid)
        run: |
          set -euo pipefail
          # --online：CI 首次运行时本地仓库不完整，脚本默认的离线 -o 会失败（不能用它冒充泄漏结论）。
          # 只跑核心 + 两个 E2E 模块（-am 带上被依赖的库模块），避免全 reactor 的 paranoid 开销。
          bash scripts/check-netty-leaks.sh --run --online --clean 1 \
            -pl spring-web,spring-web-test,spring-web-support-test -am
          # 脚本对“属性没生效”只告警（为了本地离线可用），CI 把它升级为硬断言：
          # 否则“零泄漏”可能只是没开 paranoid 的假结论。
          grep -q 'io.netty.leakDetection.level = paranoid' netty-leak-check-round1.log

      - name: Upload leak-check log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: netty-leak-log
          path: netty-leak-check-round*.log
          if-no-files-found: ignore

  docs:
    # 与 master 的差异：master 把该 job 限定在 master 分支（job 级 if），
    # 2.7.x 分支需要它自己生效，故 if 同时放行 master 与 2.7.x 两种 ref。
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || github.ref == 'refs/heads/2.7.x' || github.base_ref == '2.7.x'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check docs (links / anchors / format / symbols)
        run: bash scripts/check-docs.sh

  javadoc:
    # Javadoc 也是一次"文档正确性编译"：坏链接 / 坏标签在此暴露。
    # 与 master 的差异：① if 同样放行 2.7.x；② 用 JDK 8（与本分支编译目标一致，
    # master 用 17）；③ 插件版本沿用本分支的 3.2.0，不做工具版本升级。
    # ④ doclint 采用 master 同款口径 all,-missing。`-Ddoclint=all,-missing` 与 master 的
    #    `-DadditionalJOption=-Xdoclint:all,-missing` 等价：插件把 additionalJOption 的值
    #    原样追加到 javadoc 命令行（实测 `javadoc.exe -Xdoclint:all,-missing @options @argfile`），
    #    而 `doclint`（user property）的值写进 target/site/apidocs/options，同一句。
    #    注意 JDK 8 与 JDK 17 的分组语义不同：`@param/@return 没有说明` 在 JDK 8 属 syntax 组、
    #    `-missing` 排除不掉（JDK 17 才归入 missing），故 JDK 8 下本门禁比 master 严；
    #    还有 `{@code}` 块内「行首 @」会被当块标签（<pre>{@code @Configuration 即为此调整）。
    #    另：模块级 <doclint>（spring-web-mvc-support/pom.xml，已同步 master）优先于 -Ddoclint。
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master' || github.ref == 'refs/heads/2.7.x' || github.base_ref == '2.7.x'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Install the reactor for the javadoc run
        # javadoc:javadoc 是"直接调 goal"：它只能从本地仓库解析各模块产物，而独立 runner
        # 上什么都没构建过，于是 spring-web:jar 找不到。先 install 一次，下面那条命令才有东西可用。
        run: ./mvnw install -DskipTests -Dspotbugs.skip=true -Dmodernizer.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true --batch-mode --no-transfer-progress -q

      - name: "Javadoc (doclint: all except missing; JDK 8 适配见 checklist §31.9.6)"
        run: ./mvnw javadoc:javadoc -Ddoclint=all,-missing --batch-mode --no-transfer-progress -q

      # -Werror 是 JDK 9+ 才有的 javadoc 选项；JDK 8 的 javadoc 会直接报
      # “invalid flag: -Werror” 退出 1（CI run 45763542645 的 javadoc job 即因此失败）。
      # 上一步的全仓 doclint 仍用 JDK 8（与本分支编译目标一致），这里仅为注解包门禁切到 17。
      - name: Set up JDK 17 (annotation package doclint)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin
          # 不重复配置 cache：上一步 JDK 8 的 setup-java 已为同一 job 建立 Maven 缓存。

      - name: "Javadoc (annotation package: missing tags are errors)"
        # 注解包是用户直接写在业务代码里的入口，缺 @param/@return 会直接影响使用者，
        # 因此单独对 io.springperf.web.annotation 打开 missing 并升级为错误。
        # 用原生命令而不是 javadoc:javadoc：插件没有「只检查某个子包」的参数，
        # 而全模块开 missing 会产生上百条内部类的告警（与既定取舍冲突）。
        run: |
          set -euo pipefail
          # 不用 -o：dependency 插件在冷启动的 runner 上可能尚未落到本地仓库
          ./mvnw -q -pl spring-web dependency:build-classpath -Dmdep.outputFile=target/cp.txt
          javadoc -Xdoclint:all -Werror -encoding UTF-8 -docencoding UTF-8 -charset UTF-8 \
            -d target/jd-annotation \
            -classpath "$(cat spring-web/target/cp.txt):spring-web/target/classes" \
            -sourcepath spring-web/src/main/java io.springperf.web.annotation
