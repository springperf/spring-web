<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
<style>
 .title { font: bold 15px -apple-system,BlinkMacSystemFont,sans-serif; fill: #1f2937; }
 .label { font: 13px -apple-system,BlinkMacSystemFont,sans-serif; fill: #374151; }
 .value { font: bold 13px -apple-system,BlinkMacSystemFont,sans-serif; fill: #1f2937; }
 .sub { font: 11px -apple-system,BlinkMacSystemFont,sans-serif; fill: #6b7280; }
 .unit { font: 11px -apple-system,BlinkMacSystemFont,sans-serif; fill: #6b7280; }
 .mvc  { font: 11px -apple-system,BlinkMacSystemFont,sans-serif; fill: #9ca3af; }
 .legend { font: 12px -apple-system,BlinkMacSystemFont,sans-serif; fill: #374151; }
 .baseline { stroke: #d1d5db; stroke-dasharray: 4,4; }
</style>
<rect x="0" y="0" width="800" height="300" rx="12" fill="#f8fafc"/>
<text x="30" y="32" class="title">WebPerf 性能对比 — vs Spring MVC (Tomcat)</text>
<text x="620" y="32" class="sub">数值越大越好</text>
<rect x="30" y="48" width="12" height="12" rx="2" fill="#22c55e"/>
<text x="48" y="59" class="legend">4 线程</text>
<rect x="110" y="48" width="12" height="12" rx="2" fill="#16a34a"/>
<text x="128" y="59" class="legend">16 线程（高并发）</text>
<line x1="140" y1="72" x2="140" y2="252" stroke="#e5e7eb" stroke-width="1"/>
<!-- JSON -->
<text x="16" y="98" class="label">JSON 吞吐</text>
<rect x="140" y="100" width="75" height="14" rx="3" fill="#22c55e"/>
<text x="221" y="112" class="value">1.88x</text>
<text x="272" y="112" class="unit">37,508 ops/s</text>
<text x="385" y="112" class="mvc">|  MVC: 19,900 ops/s</text>
<rect x="140" y="118" width="64" height="14" rx="3" fill="#16a34a"/>
<text x="210" y="132" class="value">1.61x</text>
<text x="262" y="132" class="unit">73,286 ops/s</text>
<text x="385" y="132" class="mvc">|  MVC: 45,481 ops/s</text>
<!-- GET -->
<text x="16" y="158" class="label">GET 吞吐</text>
<rect x="140" y="160" width="90" height="14" rx="3" fill="#22c55e"/>
<text x="236" y="172" class="value">2.26x</text>
<text x="290" y="172" class="unit">38,538 ops/s</text>
<text x="400" y="172" class="mvc">|  MVC: 17,051 ops/s</text>
<rect x="140" y="178" width="74" height="14" rx="3" fill="#16a34a"/>
<text x="220" y="192" class="value">1.84x</text>
<text x="272" y="192" class="unit">72,636 ops/s</text>
<text x="400" y="192" class="mvc">|  MVC: 39,398 ops/s</text>
<!-- SSE -->
<text x="16" y="218" class="label">SSE 吞吐</text>
<rect x="140" y="220" width="505" height="14" rx="3" fill="#22c55e"/>
<text x="152" y="232" class="value">12.63x</text>
<text x="212" y="232" class="unit">13,323 ops/s</text>
<text x="652" y="232" class="mvc">|  MVC: 1,055 ops/s</text>
<rect x="140" y="238" width="309" height="14" rx="3" fill="#16a34a"/>
<text x="455" y="252" class="value">7.72x</text>
<text x="505" y="252" class="unit">14,920 ops/s</text>
<text x="620" y="252" class="mvc">|  MVC: 1,933 ops/s</text>
<line x1="140" y1="72" x2="140" y2="252" class="baseline"/>
<text x="145" y="290" class="sub">Spring MVC 基线 &#160; 1.0x</text>
</svg>
